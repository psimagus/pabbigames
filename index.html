<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Board Games for Bored Girls</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  padding:24px 12px;
  background:#1a1a2e;
  color:#eee;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
}
main{
  width:min(94vw,520px);
  text-align:center;
}
h1{
  margin:0;
  font-size:clamp(2rem,9vw,3.15rem);
  line-height:1.05;
  letter-spacing:2px;
  text-transform:uppercase;
}
.tagline{
  max-width:460px;
  margin:16px auto 26px;
  color:#d6d9e2;
  font-size:clamp(.98rem,4.2vw,1.15rem);
  line-height:1.45;
}
.games{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}
.game{
  min-height:76px;
  padding:12px 8px;
  border:1px solid #355071;
  border-radius:11px;
  background:#0f3460;
  color:#fff;
  box-shadow:0 4px 10px #0004;
  display:flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  font-size:clamp(.94rem,4.2vw,1.12rem);
  font-weight:750;
  letter-spacing:.5px;
  transition:transform .12s,background .12s,color .12s,border-color .12s;
}
.game:hover,.game:focus-visible{
  background:#eab308;
  border-color:#facc15;
  color:#111827;
  transform:translateY(-2px);
  outline:none;
}
.game:active{transform:translateY(0)}
@media(max-width:330px){
  body{padding-top:16px;padding-bottom:16px}
  .games{grid-template-columns:1fr;gap:7px}
  .game{min-height:51px}
}
</style>
</head>
<body>
<main>
  <h1>Board Games for Bored Girls</h1>
  <p class="tagline">Play Pabbi, play Cassie, play each other or play your friends</p>

  <nav class="games" aria-label="Board games">
    <a class="game" href="chess.html">Chess</a>
    <a class="game" href="draughts.html">Draughts</a>
    <a class="game" href="hnefatafl.html">Hnefatafl</a>
    <a class="game" href="xiangqi.html">Chinese Chess</a>
    <a class="game" href="reversi.html">Reversi</a>
    <a class="game" href="9mensmorris.html">Nine Men's Morris</a>
  </nav>
</main>
</body>
</html>
